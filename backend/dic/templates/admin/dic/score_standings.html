{% extends "admin/base_site.html" %}
{% block content %}
<form method="get"><label>Camp <select name="edition">{% for camp in editions %}<option value="{{ camp.pk }}" {% if camp.pk == edition.pk %}selected{% endif %}>{{ camp.name }}</option>{% endfor %}</select></label><button type="submit">Show rankings</button></form>
<table><thead><tr><th>Rank</th><th>House</th><th>Awarded</th><th>Deducted</th><th>Points</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.rank }}</td><td>{{ row.name }}</td><td>{{ row.awarded }}</td><td>{{ row.deducted }}</td><td>{{ row.net }}</td></tr>{% empty %}<tr><td colspan="5">No houses configured.</td></tr>{% endfor %}</tbody></table>
{% endblock %}

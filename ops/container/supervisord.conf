[supervisord]
nodaemon=true
logfile=/dev/stderr
logfile_maxbytes=0
loglevel=warn
pidfile=/run/dawana/supervisor.pid
childlogdir=/run/dawana

[program:gunicorn]
directory=/app/backend
command=/opt/venv/bin/python -m gunicorn config.wsgi:application --config gunicorn.conf.py --pid /run/dawana/gunicorn.pid
autostart=true
autorestart=false
startsecs=0
stopsignal=TERM
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /run/dawana/nginx.conf -g "daemon off;"
autostart=true
autorestart=false
startsecs=0
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:failure]
command=/opt/venv/bin/python /app/container/process_failure.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=1
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

name: Archived container rollback verification (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
# Serialize releases to avoid overlapping updates to main.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Pure gateway tests (no application or database imports)
        run: |
          python -I -B -c "import ast,pathlib; files=list(pathlib.Path('ops/container').glob('*.py')); [ast.parse(p.read_text(),filename=str(p)) for p in files]; print('Python packaging syntax parsed:',len(files))"
          python -I -B -m unittest discover -s ops/container -p 'test_*.py' -v
          node ops/container/validate.mjs
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Resolve digest-pinned build inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:22.19.0-bookworm-slim
          docker pull python:3.13-slim-bookworm
          node_image=$(docker image inspect node:22.19.0-bookworm-slim --format '{{index .RepoDigests 0}}')
          python_image=$(docker image inspect python:3.13-slim-bookworm --format '{{index .RepoDigests 0}}')
          printf 'NODE_IMAGE=%s\nPYTHON_IMAGE=%s\nSOURCE_REVISION=%s\n' "$node_image" "$python_image" "$GITHUB_SHA" > "$RUNNER_TEMP/container-inputs.txt"
          printf 'node=%s\npython=%s\n' "$node_image" "$python_image" >> "$GITHUB_OUTPUT"
      - name: Build once for verification (no publication)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./ops/container/Dockerfile.rollback
          platforms: linux/amd64
          load: true
          push: false
          tags: dawana-package:ci
          labels: |
            org.opencontainers.image.source=https://github.com/AbuHumayd1/DAWANA-ISLAMIC-FOUNDATION_WEB-APP
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NODE_IMAGE=${{ steps.inputs.outputs.node }}
            PYTHON_IMAGE=${{ steps.inputs.outputs.python }}
            SOURCE_REVISION=${{ github.sha }}
      - name: Synthetic routing, readiness and shutdown (no database)
        run: |
          set +e
          docker run --rm dawana-package:ci
          result=$?
          set -e
          echo "Unconfigured container exit code: $result (expected 1)"
          test "$result" = 1
          echo "START: direct-TLS smoke"
          bash ops/container/smoke.sh dawana-package:ci
          echo "PASS: direct-TLS smoke"
          echo "START: trusted-edge smoke"
          bash ops/container/smoke-edge.sh dawana-package:ci
          echo "PASS: trusted-edge smoke"
      - name: Record installed dependencies
        run: |
          docker image inspect dawana-package:ci --format '{{.Id}}' >> "$RUNNER_TEMP/container-inputs.txt"
          docker run --rm --entrypoint cat dawana-package:ci /opt/venv/resolved-requirements.txt > "$RUNNER_TEMP/container-python.txt"
          docker run --rm --entrypoint cat dawana-package:ci /app/container/system-packages.txt > "$RUNNER_TEMP/container-system.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: container-build-inputs
          path: ${{ runner.temp }}/container-*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Export verified image
        if: github.repository == 'AbuHumayd1/DAWANA-ISLAMIC-FOUNDATION_WEB-APP' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: docker save --output "$RUNNER_TEMP/verified-image.tar" dawana-package:ci
      - name: Retain verified image for this run
        if: github.repository == 'AbuHumayd1/DAWANA-ISLAMIC-FOUNDATION_WEB-APP' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-image-${{ github.sha }}
          path: ${{ runner.temp }}/verified-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: packaging
    if: github.repository == 'AbuHumayd1/DAWANA-ISLAMIC-FOUNDATION_WEB-APP' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # Same-run artifact only; no checkout or application execution with write access.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-image-${{ github.sha }}
          path: ${{ runner.temp }}/verified-image
      - name: Load verified image
        run: docker load --input "$RUNNER_TEMP/verified-image/verified-image.tar"
      - name: Generate explicit release tags
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/abuhumayd1/dawana-web
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main
      - name: Log in to GHCR using the job token
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker tag dawana-package:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          image=ghcr.io/abuhumayd1/dawana-web
          digest=$(docker image inspect "$image:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          printf 'Published verified commit: %s\nDeploy by digest: %s\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"

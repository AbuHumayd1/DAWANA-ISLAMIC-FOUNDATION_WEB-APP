{
  "name": "Production schema recovery",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "phase": {
          "description": "Manually selected operation",
          "type": "choice",
          "options": [
            "PREFLIGHT",
            "INITIALIZE"
          ],
          "required": true,
          "default": "PREFLIGHT"
        },
        "preflight_run": {
          "description": "INITIALIZE only - successful PREFLIGHT run ID",
          "type": "string"
        },
        "approved_plan_sha256": {
          "description": "INITIALIZE only - reviewed plan_sha256",
          "type": "string"
        },
        "approved_backup_sha256": {
          "description": "INITIALIZE only - reviewed encrypted backup SHA-256",
          "type": "string"
        },
        "approval": {
          "description": "INITIALIZE only - type INITIALIZE dawana_db",
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "dawana-production-schema-recovery",
    "cancel-in-progress": false
  },
  "jobs": {
    "recovery": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 45,
      "environment": "${{ inputs.phase == 'INITIALIZE' && 'production-initialize' || 'production-preflight' }}",
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install native PostgreSQL 18 and isolated restore account",
          "run": "set -euo pipefail\n. /etc/os-release\ntest \"$VERSION_ID\" = '24.04'\nsudo apt-get update -qq\nsudo apt-get install -y --no-install-recommends ca-certificates curl postgresql-common\nsudo install -d -m 755 /usr/share/postgresql-common/pgdg\nsudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc\nprintf '%s\\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null\n# Do not create or reuse a package-managed default cluster.\nprintf '%s\\n' 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null\nsudo apt-get update -qq\nsudo apt-get install -y --no-install-recommends postgresql-client-18 postgresql-18\nif id dawana_restore >/dev/null 2>&1; then\n  echo 'Dedicated restore account unexpectedly exists; reuse refused.'\n  exit 1\nfi\nsudo useradd --system --no-create-home --home-dir /nonexistent --shell /usr/sbin/nologin dawana_restore\n# Root-owned helpers are readable, but cannot be edited by the restore account.\nsudo install -d -m 755 /opt/dawana-schema-recovery\nsudo install -m 644 backend/config/github_schema_recovery.py backend/config/schema_recovery_native.py /opt/dawana-schema-recovery/\n"
        },
        {
          "name": "Test recovery tool diagnostics without production access",
          "run": "python -I -B scripts/test_schema_recovery_tools.py\n"
        },
        {
          "name": "Validate manual request before accessing production secrets",
          "env": {
            "PHASE": "${{ inputs.phase }}",
            "PREFLIGHT_RUN": "${{ inputs.preflight_run }}",
            "PLAN_HASH": "${{ inputs.approved_plan_sha256 }}",
            "BACKUP_HASH": "${{ inputs.approved_backup_sha256 }}",
            "APPROVAL": "${{ inputs.approval }}"
          },
          "run": "python - <<'PY'\nimport os, re\nif os.environ['PHASE'] == 'INITIALIZE':\n    assert os.environ['APPROVAL'] == 'INITIALIZE dawana_db', 'Explicit approval missing'\n    assert re.fullmatch(r'[1-9][0-9]*', os.environ['PREFLIGHT_RUN']), 'Run ID missing'\n    for key in ('PLAN_HASH', 'BACKUP_HASH'):\n        assert re.fullmatch(r'[0-9a-f]{64}', os.environ[key]), 'Approval hash missing'\nassert os.environ['GITHUB_RUN_ATTEMPT'] == '1', 'Reruns are forbidden; create a reviewed dispatch'\nPY\n"
        },
        {
          "name": "Install reviewed Django dependencies",
          "run": "python -m pip install -r backend/requirements.txt >\"$RUNNER_TEMP/recovery-install.log\" 2>&1 || {\n  echo \"Dependency installation failed; no production operation attempted.\"\n  exit 1\n}\n"
        },
        {
          "name": "Test native backup and isolated restore using synthetic data only",
          "run": "python -I -B scripts/test_schema_recovery_native.py\n"
        },
        {
          "name": "Create fresh private restore cluster without production credentials",
          "run": "umask 077\npython -I -B backend/config/github_schema_recovery.py --create-isolated-cluster\n"
        },
        {
          "name": "Download approved preflight evidence",
          "if": "inputs.phase == 'INITIALIZE'",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "production-schema-preflight",
            "path": "${{ runner.temp }}/schema-recovery/evidence",
            "run-id": "${{ inputs.preflight_run }}",
            "github-token": "${{ github.token }}"
          }
        },
        {
          "name": "Run selected recovery phase",
          "working-directory": "backend",
          "env": {
            "PHASE": "${{ inputs.phase }}",
            "PREFLIGHT_RUN": "${{ inputs.preflight_run }}",
            "PLAN_HASH": "${{ inputs.approved_plan_sha256 }}",
            "BACKUP_HASH": "${{ inputs.approved_backup_sha256 }}",
            "APPROVAL": "${{ inputs.approval }}",
            "RECOVERY_DJANGO_ENV": "${{ secrets.RECOVERY_DJANGO_ENV }}",
            "RECOVERY_BACKUP_KEY": "${{ secrets.RECOVERY_BACKUP_KEY }}",
            "RECOVERY_EXPECTED_HOST": "${{ secrets.RECOVERY_EXPECTED_HOST }}",
            "RECOVERY_EXPECTED_SCHEMA": "${{ secrets.RECOVERY_EXPECTED_SCHEMA }}",
            "RECOVERY_EXPECTED_CLUSTER_ID": "${{ secrets.RECOVERY_EXPECTED_CLUSTER_ID }}",
            "RECOVERY_POSTGRES_MAJOR": "${{ vars.RECOVERY_POSTGRES_MAJOR || '18' }}",
            "GH_TOKEN": "${{ github.token }}",
            "PYTHONUNBUFFERED": "1"
          },
          "run": "umask 077\npython -B config/github_schema_recovery.py 2>/dev/null\n"
        },
        {
          "name": "Retain encrypted backup and verified manifest",
          "if": "success() && inputs.phase == 'PREFLIGHT'",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "production-schema-preflight",
            "path": "${{ runner.temp }}/schema-recovery/evidence/backup.enc\n${{ runner.temp }}/schema-recovery/evidence/evidence.json\n${{ runner.temp }}/schema-recovery/evidence/manifest.json\n${{ runner.temp }}/schema-recovery/evidence/cache.sql",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        },
        {
          "name": "Stop isolated cluster and remove plaintext files",
          "if": "always()",
          "run": "set +e\npython -I -B backend/config/github_schema_recovery.py --stop-isolated-cluster\ncluster_status=$?\nrm -f \"$RUNNER_TEMP/schema-recovery/backup.dump\"\nexit \"$cluster_status\"\n"
        }
      ]
    }
  }
}

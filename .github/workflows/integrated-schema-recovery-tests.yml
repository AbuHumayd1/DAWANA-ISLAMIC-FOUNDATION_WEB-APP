name: Integrated schema recovery guards
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure recovery never promotes an application
        shell: bash
        run: bash scripts/test_integrated_schema_recovery.sh
  # Real PostgreSQL tests are discovered by the existing backend-acceptance
  # matrix (config.test_integrated_schema_recovery, core partition, PG14/18).

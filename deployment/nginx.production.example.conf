# Review and replace hostname, certificate and artifact paths before installation.
# This file is a proposal; no host or provider has been selected or provisioned.
server {
    listen 80;
    server_name REPLACE_WITH_APPROVED_HOST;
    return 301 https://REPLACE_WITH_APPROVED_HOST$request_uri;
}
server {
    listen 443 ssl;
    server_name REPLACE_WITH_APPROVED_HOST;
    ssl_certificate /REPLACE/fullchain.pem;
    ssl_certificate_key /REPLACE/privkey.pem;
    root /REPLACE/frontend-dist;
    index index.html;
    client_max_body_size 105m;
    client_body_timeout 60s;
    send_timeout 65s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 65s;
    proxy_read_timeout 65s;
    # Request URLs may contain private references. Use privacy-reviewed monitoring.
    access_log off;
    error_log /var/log/nginx/dawana-error.log crit;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    # Bind Gunicorn privately; do not expose it around this trusted proxy.
    location /api/ { proxy_pass http://127.0.0.1:10000; }
    location /admin/ { proxy_pass http://127.0.0.1:10000; }
    location /static/ { proxy_pass http://127.0.0.1:10000; }
    location = /media { return 404; }
    location ^~ /media/ { return 404; }
    location ~ /\. { deny all; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
